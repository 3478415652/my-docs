site_name: 3478415652 的技术文档
site_description: 使用 MkDocs Material 和 GitHub Actions 构建的个人技术文档网站
site_author: "3478415652"

site_url: https://3478415652.github.io/my-docs/
repo_url: https://github.com/3478415652/my-docs
repo_name: 3478415652/my-docs

theme:
  name: material
  language: zh
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.top
    - content.code.copy

nav:
  - 首页: index.md
  - 关于: about.md
  - 使用指南: guide.md
  - API 参考: api.md

plugins:
  - search

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
